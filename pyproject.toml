[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "magnetatlas-sverige"
version = "0.1.0"
description = "Historiskt GIS-verktyg för ansvarsfullt magnetfiske i Sverige"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { text = "License not yet selected" }
authors = [{ name = "MagnetAtlas-Sverige contributors" }]
keywords = ["gis", "history", "magnet-fishing", "sweden"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.32,<3",
    "rich>=13.7,<15",
    "SQLAlchemy>=2.0,<3",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "black>=24.10,<27",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

[project.scripts]
magnetatlas = "magnetatlas.cli:app"

[project.entry-points."magnetatlas.collectors"]
riksarkivet = "magnetatlas.infrastructure.sources.riksarkivet:create_collector"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"magnetatlas.data" = ["*.json"]
"magnetatlas.interfaces.web" = ["static/*"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.black]
target-version = ["py313"]
line-length = 88
